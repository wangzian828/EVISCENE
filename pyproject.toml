[project]
name = "eviscene"
version = "0.1.0"
description = "EviScene agentic image factuality assessment runtime"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "httpx>=0.25.0",
    "requests>=2.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1,<2"]
image-retrieval = ["oss2>=2.18"]
all = [
    "oss2>=2.18",
]

[project.scripts]
eviscene = "eviscene.__main__:main"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eviscene*", "scripts*"]
namespaces = true

[project.urls]
Homepage = "https://wangzian828.github.io/EVISCENE/"
Repository = "https://github.com/wangzian828/EVISCENE"
Issues = "https://github.com/wangzian828/EVISCENE/issues"
Models = "https://huggingface.co/ZiAnwang/EviScene"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F401", "F63", "F7", "F82", "F841"]

[tool.ruff.lint.per-file-ignores]
# Directly executable scripts initialize dotenv/import paths before project imports.
"scripts/**/*.py" = ["E402"]
